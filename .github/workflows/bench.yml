# The benchmark suite (bench/run.py: Mimic against C and Rust) on GitHub's
# runners, and the speed gate: Mimic as changed against the compiler it
# changes, both timed in turns on the same machine, each benchmark within
# the tolerance its measured noise allows (BENCHMARK.md). (Numbers from
# another run cannot be compared: each job gets a different machine.)
#
# * pull requests into dev that touch the compiler, the runtime or the
#   benchmarks: against dev, reported (it does not block);
# * release pull requests into main: against main, a required check;
# * every night, on dev: the whole suite, and the gate against main;
# * by hand: the suite and the gate against main, or `noise`.
#
# For speed, each system's gate is split across three machines (each
# compares old and new on its own third of the benchmarks, so every
# comparison stays on one machine), and the compiler before the change is
# built once per system while they build the new one. `bench (<system>)`,
# the required check, collects their verdicts.
#
# Pull requests into main and the nightly run also check the gate itself:
# the new compiler without LLVM's optimizer (MIMIC_DEBUG_DISABLE=optimizer)
# must fail it.
name: bench

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      noise:
        description: "Instead: run everything this many times unchanged and record how much each ratio to C varies (0: a normal run)"
        type: number
        default: 0
      tag:
        description: "Measure this release tag (e.g. v0.4.0) and record it as that version's phase"
        type: string
        default: ""
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

env:
  LLVM_VERSION: 23.1.4
  TAG: deps-llvm-23.1.4
  CARGO_TERM_COLOR: always

jobs:
  # into dev, only changes to what is measured run the suite
  scope:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.s.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: s
        env:
          BASE: ${{ github.base_ref }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = pull_request ] && [ "$BASE" = dev ]; then
            git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(crates|runtime|bench)/|^Cargo\.(toml|lock)$' || run=false
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  # the compiler the change goes into, once per system, cached by commit
  before:
    needs: scope
    if: needs.scope.outputs.run == 'true' && !(inputs.noise > 0)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x86_64 }
          - { os: macos-15, platform: macos-arm64 }
          - { os: windows-2025, platform: windows-x86_64 }
    name: before (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # (this change's checkout, for the setup action; the compiler before
      # it is built from a worktree beside it)
      - uses: actions/checkout@v4
      - id: sha
        env:
          BASE: perf/steady-layout
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: before-bin
          key: before-${{ matrix.platform }}-${{ steps.sha.outputs.sha }}
      - uses: ./.github/actions/setup
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          platform: ${{ matrix.platform }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          git worktree add --detach ../before "$SHA"
          if [ "$RUNNER_OS" != Windows ]; then ln -sfn "$HOME/.mimic/deps/llvm-$LLVM_VERSION" ../before/.llvm; fi
          (cd ../before && cargo build --release)
          mkdir -p before-bin
          exe=mimic; [ "$RUNNER_OS" = Windows ] && exe=mimic.exe
          cp "../before/target/release/$exe" before-bin/
          ls -l before-bin
      - uses: actions/upload-artifact@v4
        with:
          name: before-${{ matrix.platform }}
          path: before-bin/
          retention-days: 1

  gate:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    # (write: the history on the bench branch, never on pull requests;
    # actions: to see when the before job is done)
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, macos-arm64, windows-x86_64]
        shard: [0, 1, 2]
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04 }
          - { platform: macos-arm64, os: macos-15 }
          - { platform: windows-x86_64, os: windows-2025 }
    name: gate (${{ matrix.platform }}, ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # the nightly run, the self-check and noise run on the first machine
      FIRST: ${{ matrix.shard == 0 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the nightly run measures dev, where the work is; by hand, a tag
          ref: ${{ inputs.tag || (github.event_name == 'schedule' && 'dev' || '') }}

      - uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.platform }}

      - name: Build mimic
        run: cargo build --release

      # Is the machine code really vector code? Count SIMD instructions in a
      # release build of the SIMD fixture (native CPU: AVX2/AVX-512 on x86,
      # NEON on arm64).
      - name: SIMD check
        if: env.FIRST == 'true'
        run: |
          {
            echo "### CPU and SIMD (${{ matrix.platform }})"
            if [ "$(uname)" = Linux ]; then
              echo "- CPU: $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) cores"
              echo "- vector features: $(grep -o -w -E 'avx2|avx512f|fma' /proc/cpuinfo | sort -u | tr '\n' ' ')"
            elif [ "$RUNNER_OS" = Windows ]; then
              echo "- CPU: $(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" | tr -d '\r'), $NUMBER_OF_PROCESSORS cores"
            else
              echo "- CPU: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) cores"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exe=$(target/release/mimic build --release --emit-json tests/fixtures/run/simd_each.mim | "$(command -v python3 || command -v python)" -c 'import json,sys; print(json.load(sys.stdin)["artifacts"][0]["path"])')
          "$exe" | diff - tests/fixtures/run/simd_each.out
          # objdump, or on Windows the runner's own LLVM
          if [ "$RUNNER_OS" = Windows ]; then "/c/Program Files/LLVM/bin/llvm-objdump" -d "$exe" > simd.s; else objdump -d "$exe" > simd.s; fi
          ymm=$(grep -c -E '%ymm' simd.s || true)
          zmm=$(grep -c -E '%zmm' simd.s || true)
          neon=$(grep -c -E '\bv[0-9]+\.(2d|4s|8h|16b)|\s[a-z0-9]+\.(2d|4s|8h|16b)\s' simd.s || true)
          echo "- simd_each (release, native CPU): output correct; vector instructions: AVX ymm $ymm, AVX-512 zmm $zmm, NEON $neon" | tee -a "$GITHUB_STEP_SUMMARY"
          [ $((ymm + zmm + neon)) -gt 0 ]

      - name: Crates for the Rust versions
        run: for d in bench/*/rust bench/*/rayon; do [ -d "$d" ] && (cd "$d" && cargo fetch); done; true

      # the whole suite, against C and Rust: nightly and by hand
      - name: Benchmarks
        if: ${{ env.FIRST == 'true' && !(inputs.noise > 0) && github.event_name != 'pull_request' }}
        run: '"$(command -v python3 || command -v python)" bench/run.py --history bench/history.jsonl --json result.json'

      # the run into the benchmark history (the bench branch); a tag's run is
      # also that version's phase
      - uses: actions/checkout@v4
        if: ${{ env.FIRST == 'true' && !(inputs.noise > 0) && github.event_name != 'pull_request' }}
        with:
          ref: bench
          path: history
      - name: Into the history
        if: ${{ env.FIRST == 'true' && !(inputs.noise > 0) && github.event_name != 'pull_request' }}
        env:
          MACHINE: github-${{ matrix.platform }}
          PHASE: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}
        run: |
          set -euo pipefail
          py="$(command -v python3 || command -v python)"
          "$py" bench/record.py result.json bench/results.md history "$MACHINE" "${PHASE#v}"
          cd history
          git config user.name "mimic-ci"
          git config user.email "mimic-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Run $GITHUB_RUN_ID on $MACHINE${PHASE:+ ($PHASE)}"
          # the three systems finish at about the same time: rebase and retry
          for i in 1 2 3 4 5; do git push -q origin HEAD:bench && break; git pull -q --rebase origin bench; sleep $((i * 5)); done

      # the compiler before the change, from the before job (built meanwhile)
      - name: The compiler before the change
        if: ${{ !(inputs.noise > 0) }}
        run: |
          for i in $(seq 1 60); do
            gh run view "$GITHUB_RUN_ID" --json jobs --jq '.jobs[] | select(.name == "before (${{ matrix.platform }})") | .status' | grep -q completed && break
            sleep 20
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ !(inputs.noise > 0) }}
        with:
          name: before-${{ matrix.platform }}
          path: ${{ runner.temp }}/before
      - name: Where it is
        if: ${{ !(inputs.noise > 0) }}
        run: |
          exe=mimic; [ "$RUNNER_OS" = Windows ] && exe=mimic.exe
          chmod +x "$RUNNER_TEMP/before/$exe"
          echo "BEFORE=$RUNNER_TEMP/before/$exe" >> "$GITHUB_ENV"

      - name: The speed gate
        id: gate
        if: ${{ !(inputs.noise > 0) }}
        run: |
          before="$BEFORE"
          [ "$RUNNER_OS" = Windows ] && before=$(cygpath -w "$BEFORE")
          "$(command -v python3 || command -v python)" bench/run.py --runs 3 --shard ${{ matrix.shard }}/3 --gate "$before"

      # the gate must catch a real slowdown: the new compiler without
      # LLVM's optimizer, against itself (pull requests into main, nightly)
      - name: The gate catches a slowdown
        id: self
        if: ${{ env.FIRST == 'true' && !(inputs.noise > 0) && (github.event_name != 'pull_request' || github.base_ref == 'main') }}
        run: |
          py="$(command -v python3 || command -v python)"
          me=target/release/mimic; [ "$RUNNER_OS" = Windows ] && me=$(cygpath -w "$PWD/target/release/mimic.exe")
          cp bench/gate.md gate-real.md
          # (a compiler from before the switch existed, such as a stable
          # release's on main, cannot build without its optimizer: skip)
          built=target/release/mimic; [ -f target/release/mimic.exe ] && built=target/release/mimic.exe
          if ! grep -qa MIMIC_DEBUG_DISABLE "$built"; then
            echo "::notice::this compiler has no MIMIC_DEBUG_DISABLE (older than 0.4.0): the self-check is skipped"
            echo "- self-check skipped: this compiler is older than the switch it needs" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if "$py" bench/run.py fib mandelbrot sum_of_squares --runs 3 --gate "$me" --inject > injected.txt; then
            cat injected.txt
            echo "::error::a build without the optimizer passed the speed gate"
            exit 1
          fi
          sed -n '/^## Speed gate/,$p' injected.txt
          mv gate-real.md bench/gate.md
          echo "- the gate failed a build without the optimizer, as it should" >> "$GITHUB_STEP_SUMMARY"

      # the noise of this runner, for the speed gate's tolerances: each
      # machine measures its third, as in the gate (the whole corpus on one
      # machine no longer fits in the job's time)
      - name: Noise
        if: ${{ inputs.noise > 0 }}
        run: |
          "$(command -v python3 || command -v python)" bench/run.py --runs 3 --noise ${{ inputs.noise }} --shard ${{ matrix.shard }}/3 | tee noise.txt
          { echo '```'; sed -n '/^benchmark /,$p' noise.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Results
        if: always()
        run: |
          [ -f bench/gate.md ] && cat bench/gate.md >> "$GITHUB_STEP_SUMMARY" || true
          [ -f bench/results.md ] && cat bench/results.md >> "$GITHUB_STEP_SUMMARY" || true

      # this machine's verdict, for bench (<system>)
      - name: Verdict
        if: always()
        run: |
          mkdir -p verdict
          ok=fail
          if [ "${{ inputs.noise > 0 && 'noise' || '' }}" = noise ] || { [ "${{ steps.gate.outcome }}" = success ] && [ "${{ steps.self.outcome }}" != failure ]; }; then ok=pass; fi
          echo "$ok" > verdict/${{ matrix.shard }}
          [ -f bench/gate.md ] && cp bench/gate.md verdict/gate-${{ matrix.shard }}.md || true
          echo "verdict: $ok"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # one per attempt: a machine re-run with "Re-run failed jobs" adds
          # its own verdict beside the first, and the latest one counts
          name: verdict-${{ matrix.platform }}-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: verdict/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.platform }}-${{ matrix.shard }}-${{ github.sha }}
          path: |
            bench/results.md
            bench/history.jsonl
            bench/noise/
            bench/gate.md
            bench/target/machine-*.json
          if-no-files-found: ignore

  # the required check: every machine of this system passed
  bench:
    needs: [scope, gate]
    if: always() && needs.scope.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, macos-arm64, windows-x86_64]
    name: bench (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    steps:
      # each verdict in its own folder (merged into one, the first
      # attempt's file could win over a re-run's)
      - uses: actions/download-artifact@v4
        with:
          pattern: verdict-${{ matrix.platform }}-*
          path: verdicts
      - name: All three machines
        run: |
          ls verdicts 2>/dev/null || true
          bad=0
          for i in 0 1 2; do
            # the latest attempt of machine i
            last=$(ls -d verdicts/verdict-${{ matrix.platform }}-$i-a* 2>/dev/null | sed 's/.*-a//' | sort -n | tail -1)
            d="verdicts/verdict-${{ matrix.platform }}-$i-a$last"
            v=$( [ -n "$last" ] && cat "$d/$i" 2>/dev/null || echo missing)
            echo "machine $i/3: $v (attempt ${last:-none})"
            cat "$d/gate-$i.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            [ "$v" = pass ] || bad=1
          done
          exit $bad
