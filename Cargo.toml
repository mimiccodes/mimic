[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.18"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
mimic-syntax = { path = "crates/mimic-syntax" }
mimic-check = { path = "crates/mimic-check" }
mimic-codegen = { path = "crates/mimic-codegen" }
mimic-project = { path = "crates/mimic-project" }
mimic-net = { path = "crates/mimic-net" }
mimic-toolchain = { path = "crates/mimic-toolchain" }
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
serde = "1"
# the terminal editor (`mimic edit`)
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
crossterm = "0.29"
ropey = "1.6"
unicode-width = "0.2"
# Markdown guides in `mimic doc`
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# the language server (`mimic lsp`)
lsp-server = "0.7"
lsp-types = "=0.95.1"
inkwell = { version = "0.11", default-features = false, features = ["llvm23-1", "target-all"] }

[profile.release]
# the compiler itself as fast as it can be built
opt-level = 3
# whole-program optimisation across every crate, and one codegen unit per
# crate (more inlining, slower to build)
lto = "fat"
codegen-units = 1
# no unwinding: nothing catches panics; an internal error still prints its
# message, then aborts
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
# no symbol tables in the binary (much smaller)
strip = "symbols"
