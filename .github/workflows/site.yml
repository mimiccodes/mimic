name: site
# Rebuild mimic.codes when what it shows changes: after a release (its
# docs and tutorial are read from the latest release), and when the roadmap,
# changelog, benchmarks or design notes change on main (read from main).
# The site's install scripts are served live from tools/get and need no
# rebuild.
#
# Needs the secret VERCEL_DEPLOY_HOOK: the URL of a deploy hook for the
# site's main branch (Vercel → the site's project → Settings → Git →
# Deploy Hooks). Without it, this does nothing.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  push:
    branches: [main]
    paths:
      - docs/versions.md
      - docs/design/**
      - CHANGELOG.md
      - BENCHMARK.md
  workflow_dispatch:

permissions: {}

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild mimic.codes
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK is not set; nothing to do"
            exit 0
          fi
          # a release's tag must be visible as "latest" before the site
          # reads it; GitHub updates that within seconds
          if [ "${{ github.event_name }}" = "workflow_run" ]; then sleep 30; fi
          curl -fsS --retry 3 -X POST "$HOOK" | head -c 300
          echo
