# Build `mimic` for Linux x86_64, macOS arm64 and Windows x86_64 and publish
# them as one GitHub release, with checksums. Runs when a version tag is
# pushed (`git tag v0.2.0 && git push origin v0.2.0`), or by hand for a tag
# that exists, or from the nightly workflow. The release notes are the
# tag's section of CHANGELOG.md (its Unreleased section for previews and
# nightlies).
#
# Stable tags are vX.Y.Z (and vX.Y.Z-fix.N for an urgent fix); previews
# vX.Y.Z-preview.N, published as pre-releases, which GitHub never calls
# "latest"; the nightly build is the one pre-release tagged `nightly`,
# replaced each night (see docs/versions.md).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.2.0)"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "The release's tag (nightly)"
        type: string
        required: true
      ref:
        description: "The commit to build"
        type: string
        required: true
      version:
        description: "The version it reports (e.g. 0.4.1-nightly.20261118)"
        type: string
        required: true

permissions:
  contents: write

env:
  MANYLINUX: quay.io/pypa/manylinux_2_28_x86_64
  LLVM_VERSION: 23.1.4
  LLVM_TAG: deps-llvm-23.1.4
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  REF: ${{ inputs.ref || inputs.tag || github.ref_name }}
  # the version it reports: given (nightly), else the tag's
  INPUT_VERSION: ${{ inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: windows-2025
            platform: windows-x86_64
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Version
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            perl -0pi -e 's/(\[workspace\.package\]\nversion = )"[^"]*"/$1"$ENV{INPUT_VERSION}"/' Cargo.toml
          fi
          echo "VERSION=${INPUT_VERSION:-${TAG#v}}" >> $GITHUB_ENV
          grep -m1 '^version' Cargo.toml

      - name: Rust
        run: rustup update stable && rustup default stable && rustc --version

      # Unix-style paths for the shell's tools (Git Bash's tar reads `C:` as a
      # host); Windows paths for what Rust reads
      - name: LLVM (from the llvm workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deps="$HOME/.mimic/deps"
          mkdir -p "$deps"
          gh release download "$LLVM_TAG" -p "llvm-$LLVM_VERSION-${{ matrix.platform }}.tar.xz" -D "$deps"
          tar -xJf "$deps/llvm-$LLVM_VERSION-${{ matrix.platform }}.tar.xz" -C "$deps"
          rm "$deps/llvm-$LLVM_VERSION-${{ matrix.platform }}.tar.xz"
          "$deps/llvm-$LLVM_VERSION/bin/llvm-config" --version
          if [ "$RUNNER_OS" = Windows ]; then
            echo "LLVM_SYS_231_PREFIX=$(cygpath -w "$deps/llvm-$LLVM_VERSION")" >> $GITHUB_ENV
            echo "MIMIC_DEPS=$(cygpath -w "$deps")" >> $GITHUB_ENV
          elif [ "$RUNNER_OS" = macOS ]; then
            ln -sfn "$deps/llvm-$LLVM_VERSION" .llvm
          fi

      - name: Other dependencies (tools/deps.sh)
        if: runner.os != 'Linux'
        run: LLVM_PREFIX="$HOME/.mimic/deps/llvm-$LLVM_VERSION" MIMIC_DEPS="$HOME/.mimic/deps" tools/deps.sh

      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --release

      # Linux: built inside manylinux_2_28 (glibc 2.28, like the LLVM it
      # links), so it runs on Linux systems from 2018 on
      - name: Build (Linux, glibc 2.28)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$HOME/.mimic:/root/.mimic" -v "$PWD:/src" -w /src \
            -e LLVM_SYS_231_PREFIX=/root/.mimic/deps/llvm-$LLVM_VERSION -e CARGO_TERM_COLOR \
            "$MANYLINUX" bash -euc '
              # the link asks for libffi (LLVM itself is built without it):
              # --as-needed drops it again, as the check below makes sure
              dnf -y -q install libffi-devel
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null
              . "$HOME/.cargo/env"
              LLVM_PREFIX=$LLVM_SYS_231_PREFIX MIMIC_DEPS=/root/.mimic/deps tools/deps.sh
              cargo build --release'
          sudo chown -R "$(id -u):$(id -g)" target "$HOME/.mimic"
          # the shared libraries it needs: only the C library's own
          objdump -p target/release/mimic | grep NEEDED
          if objdump -p target/release/mimic | grep NEEDED | grep -vqE 'lib(c|m|dl|rt|pthread|gcc_s|stdc\+\+)\.so|ld-linux'; then
            echo "error: mimic needs a shared library a plain Linux system may not have" >&2; exit 1
          fi
          # the newest glibc symbol version it needs
          need=$(objdump -T target/release/mimic | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "needs $need"
          [ "$(printf '%s\nGLIBC_2.28\n' "$need" | sort -V | tail -1)" = GLIBC_2.28 ] || { echo "error: needs a glibc newer than 2.28" >&2; exit 1; }

      # the binary must work on its own: a project created, built and run
      # with nothing but `mimic` (and, on Linux and macOS, the system linker)
      - name: Check
        run: |
          m="$PWD/target/release/mimic"
          "$m" --version
          "$m" --version | grep -qF "mimic $VERSION " || { echo "error: the build does not report $VERSION" >&2; exit 1; }
          "$m" cc --version
          cd "$RUNNER_TEMP"
          "$m" create hello
          cd hello
          "$m" run

      - name: Package
        run: |
          name=mimic-$VERSION-${{ matrix.platform }}
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/mimic.exe tools/release/install.ps1 tools/release/install.cmd "dist/$name/"
          else
            cp target/release/mimic tools/release/install.sh "dist/$name/"
            chmod +x "dist/$name/install.sh"
          fi
          cp LICENSE NOTICE README.md CHANGELOG.md "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            ls -l "$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            ls -l "$name.tar.gz"
          fi

      # the install script, as a team mate would run it, from the package
      - name: Install script
        run: |
          name=mimic-$VERSION-${{ matrix.platform }}
          if [ "$RUNNER_OS" = Windows ]; then
            run() { powershell -NoProfile -ExecutionPolicy Bypass -File "dist/$name/install.ps1" "$@" < /dev/null; }
            home="$USERPROFILE/.mimic"
          else
            run() { "dist/$name/install.sh" "$@" < /dev/null; }
            home="$HOME/.mimic"
          fi
          run
          "$home/bin/mimic" --version
          # an upgrade over an older mimic: its build cache goes, libraries stay
          echo "mimic 0.0.1 (old)" > "$home/installed-version"
          mkdir -p "$home/cache/stale" "$home/libraries/kept"
          run | tee upgrade.txt
          grep -q "replacing mimic 0.0.1" upgrade.txt
          grep -q "cleared the build cache" upgrade.txt
          [ ! -d "$home/cache/stale" ] && [ -d "$home/libraries/kept" ]
          if [ "$RUNNER_OS" = Windows ]; then run -Uninstall; else run --uninstall; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and notes
        run: |
          VERSION=${INPUT_VERSION:-${TAG#v}}
          cd dist
          # which version this release is, for the install scripts (the
          # nightly's tag does not say)
          echo "$VERSION" > version.txt
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd ..
          # this version's section of CHANGELOG.md, then how to install
          VERSION=$VERSION python3 - <<'PY' > notes.md
          import os, re
          v = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          def section(name):
              m = re.search(r"^## " + re.escape(name) + r"\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
              return m.group(1).strip() if m else ""
          if "-preview." in v or "-nightly." in v:
              kind = "nightly build of the development branch" if "-nightly." in v else "preview of the next version"
              print(f"A {kind}: not a stable release. Install it with `mimic upgrade --{'nightly' if '-nightly.' in v else 'preview'}`.")
              print()
              print(section("Unreleased") or "No changes listed yet.")
          else:
              print(section(v) or f"Mimic {v}.")
          print(open(".github/release-install.md", encoding="utf-8").read().replace("{v}", v))
          PY

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${INPUT_VERSION:-${TAG#v}}
          # a release is made as a draft, gets its files, and only then is
          # published: the install scripts never see a release without them
          if [ "$TAG" = nightly ]; then
            # one nightly at a time: the last one goes, tag included
            gh release delete nightly --cleanup-tag -y 2>/dev/null || true
            gh release create nightly --draft --target "$REF" --prerelease --title "Mimic nightly $VERSION" --notes-file notes.md
          elif ! gh release view "$TAG" >/dev/null 2>&1; then
            case "$TAG" in
            *-preview.*) gh release create "$TAG" --draft --title "Mimic $VERSION" --notes-file notes.md --verify-tag --prerelease ;;
            *) gh release create "$TAG" --draft --title "Mimic $VERSION" --notes-file notes.md --verify-tag ;;
            esac
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
