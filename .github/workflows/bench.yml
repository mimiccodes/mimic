# The benchmark suite (bench/run.py: Mimic against C and Rust) on
# GitHub's runners: by hand, and every Monday. The results table is shown on
# the run's page and kept as a download with the run's history line.
# (Shared runners are noisy: compare ratios to C, not absolute times.)
name: bench

on:
  workflow_dispatch:
    inputs:
      noise:
        description: "Instead: run everything this many times unchanged and record how much each ratio to C varies (0: a normal run)"
        type: number
        default: 0
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  LLVM_VERSION: 23.1.4
  TAG: deps-llvm-23.1.4
  CARGO_TERM_COLOR: always

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: windows-2025
            platform: windows-x86_64
    name: bench (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup update stable && rustup default stable

      - name: LLVM (from the llvm workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deps="$HOME/.mimic/deps"
          mkdir -p "$deps"
          gh release download "$TAG" -p "llvm-$LLVM_VERSION-${{ matrix.platform }}.tar.xz" -D "$deps"
          tar -xJf "$deps/llvm-$LLVM_VERSION-${{ matrix.platform }}.tar.xz" -C "$deps"
          rm "$deps/llvm-$LLVM_VERSION-${{ matrix.platform }}.tar.xz"
          if [ "$RUNNER_OS" = Windows ]; then
            # Windows paths for what Rust reads (Git Bash's tools take the others)
            echo "LLVM_SYS_231_PREFIX=$(cygpath -w "$deps/llvm-$LLVM_VERSION")" >> $GITHUB_ENV
            echo "MIMIC_DEPS=$(cygpath -w "$deps")" >> $GITHUB_ENV
          else
            ln -sfn "$deps/llvm-$LLVM_VERSION" .llvm
          fi

      - name: Other dependencies (tools/deps.sh)
        run: LLVM_PREFIX="$HOME/.mimic/deps/llvm-$LLVM_VERSION" MIMIC_DEPS="$HOME/.mimic/deps" tools/deps.sh

      - name: Build mimic
        run: cargo build --release

      # Is the machine code really vector code? Count SIMD instructions in a
      # release build of the SIMD fixture (native CPU: AVX2/AVX-512 on x86,
      # NEON on arm64).
      - name: SIMD check
        run: |
          {
            echo "### CPU and SIMD (${{ matrix.platform }})"
            if [ "$(uname)" = Linux ]; then
              echo "- CPU: $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) cores"
              echo "- vector features: $(grep -o -w -E 'avx2|avx512f|fma' /proc/cpuinfo | sort -u | tr '\n' ' ')"
            elif [ "$RUNNER_OS" = Windows ]; then
              echo "- CPU: $(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" | tr -d '\r'), $NUMBER_OF_PROCESSORS cores"
            else
              echo "- CPU: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) cores"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exe=$(target/release/mimic build --release --emit-json tests/fixtures/run/simd_each.mim | "$(command -v python3 || command -v python)" -c 'import json,sys; print(json.load(sys.stdin)["artifacts"][0]["path"])')
          "$exe" | diff - tests/fixtures/run/simd_each.out
          # objdump, or on Windows the runner's own LLVM
          if [ "$RUNNER_OS" = Windows ]; then "/c/Program Files/LLVM/bin/llvm-objdump" -d "$exe" > simd.s; else objdump -d "$exe" > simd.s; fi
          ymm=$(grep -c -E '%ymm' simd.s || true)
          zmm=$(grep -c -E '%zmm' simd.s || true)
          neon=$(grep -c -E '\bv[0-9]+\.(2d|4s|8h|16b)|\s[a-z0-9]+\.(2d|4s|8h|16b)\s' simd.s || true)
          echo "- simd_each (release, native CPU): output correct; vector instructions: AVX ymm $ymm, AVX-512 zmm $zmm, NEON $neon" | tee -a "$GITHUB_STEP_SUMMARY"
          [ $((ymm + zmm + neon)) -gt 0 ]

      - name: Crates for the Rust versions
        run: for d in bench/*/rust bench/*/rayon; do (cd "$d" && cargo fetch); done

      - name: Benchmarks
        if: ${{ !inputs.noise }}
        run: '"$(command -v python3 || command -v python)" bench/run.py --history bench/history.jsonl'

      # the noise of this runner, for the speed gate's tolerances
      - name: Noise
        if: ${{ inputs.noise }}
        run: |
          "$(command -v python3 || command -v python)" bench/run.py --noise ${{ inputs.noise }} | tee noise.txt
          { echo '```'; sed -n '/^benchmark /,$p' noise.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Results
        if: always()
        run: |
          [ -f bench/results.md ] && cat bench/results.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.platform }}-${{ github.sha }}
          path: |
            bench/results.md
            bench/history.jsonl
            bench/noise/
            bench/target/machine-*.json
          if-no-files-found: ignore
