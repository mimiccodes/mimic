# Build mimic and run every test on Linux and macOS, build mimic on Windows
# and run the golden programs there (built on Windows, and built on Linux),
# on every push to main
# and every pull request. The LLVM it links comes from the llvm workflow's
# release download.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: 23.1.4
  TAG: deps-llvm-23.1.4
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup update stable && rustup default stable && rustc --version

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: LLVM (from the llvm workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.mimic/deps
          gh release download "$TAG" -p "llvm-$LLVM_VERSION-${{ matrix.platform }}.tar.xz" -D ~/.mimic/deps
          tar -xJf ~/.mimic/deps/llvm-$LLVM_VERSION-${{ matrix.platform }}.tar.xz -C ~/.mimic/deps
          rm ~/.mimic/deps/llvm-$LLVM_VERSION-${{ matrix.platform }}.tar.xz
          ln -sfn ~/.mimic/deps/llvm-$LLVM_VERSION .llvm
          .llvm/bin/llvm-config --version

      - name: Other dependencies (tools/deps.sh)
        run: LLVM_PREFIX=$HOME/.mimic/deps/llvm-$LLVM_VERSION tools/deps.sh

      - name: Build
        run: cargo build --release

      # Windows programs are cross-built here and run by the windows job
      - name: Windows programs (cross-built)
        if: runner.os == 'Linux'
        run: tools/build-fixtures.sh x86_64-windows winfix

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: windows-x86_64-fixtures
          path: winfix
          retention-days: 3

      - name: Test
        run: cargo test --release --no-fail-fast

      - name: Tutorial
        run: python3 tools/check-tutorial.py --mimic target/release/mimic

      # Was the GPU really used? Without a Metal device the runtime runs the
      # same kernels on the CPU (same results), so passing tests prove nothing
      # about it; this reports what the runner had.
      - name: GPU (Metal)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          for f in gpu_map gpu_each; do
            MIMIC_GPU=1 MIMIC_GPU_DEBUG=1 target/release/mimic run --release tests/fixtures/run/$f.mim > /tmp/$f.out 2> /tmp/$f.err
            diff -q /tmp/$f.out tests/fixtures/run/$f.out
            ran=$(grep -c "GPU kernel .*: ran" /tmp/$f.err || true)
            echo "$f: $(grep -m1 -E "Metal GPU ready|no Metal GPU" /tmp/$f.err), $ran kernel(s) ran on the GPU" | tee -a $GITHUB_STEP_SUMMARY
          done

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          for f in /tmp/mimic-golden-home/cache/libc/compiler-rt/*/skipped.txt; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; echo; }
          done
          true

  # The golden programs, cross-built for Windows by the Linux job, run on
  # Windows with the same expected output.
  windows:
    name: run (windows-x86_64, built on Linux)
    needs: test
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64-fixtures
          path: winfix

      - name: Run
        shell: bash
        run: tools/run-fixtures.sh winfix

  # mimic itself on Windows (MSVC Rust, the llvm workflow's Windows LLVM):
  # it builds the golden programs for its own machine, which then run there.
  windows-native:
    name: test (windows-x86_64)
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup update stable && rustup default stable && rustc --version

      # (no MSVC environment step: Rust and the cc crate find Visual Studio
      # themselves, and on PATH Git Bash's `link` would hide MSVC's linker)

      - name: LLVM (from the llvm workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Unix-style paths for Git Bash's tools (tar reads `C:` as a host);
          # Windows paths for what Rust reads
          deps="$HOME/.mimic/deps"
          mkdir -p "$deps"
          gh release download "$TAG" -p "llvm-$LLVM_VERSION-windows-x86_64.tar.xz" -D "$deps"
          tar -xJf "$deps/llvm-$LLVM_VERSION-windows-x86_64.tar.xz" -C "$deps"
          rm "$deps/llvm-$LLVM_VERSION-windows-x86_64.tar.xz"
          "$deps/llvm-$LLVM_VERSION/bin/llvm-config" --version
          echo "LLVM_SYS_231_PREFIX=$(cygpath -w "$deps/llvm-$LLVM_VERSION")" >> $GITHUB_ENV
          echo "MIMIC_DEPS=$(cygpath -w "$deps")" >> $GITHUB_ENV

      - name: Other dependencies (tools/deps.sh)
        run: LLVM_PREFIX="$HOME/.mimic/deps/llvm-$LLVM_VERSION" MIMIC_DEPS="$HOME/.mimic/deps" tools/deps.sh

      - name: Build
        run: cargo build --release

      - name: Smoke
        run: |
          target/release/mimic --version
          target/release/mimic run tests/fixtures/run/basics.mim

      - name: Golden programs (built here, for this machine)
        run: |
          tools/build-fixtures.sh native natfix
          tools/run-fixtures.sh natfix

      - name: Test
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo test --release --no-fail-fast
