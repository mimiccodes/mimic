[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mimic-syntax = { path = "crates/mimic-syntax" }
mimic-check = { path = "crates/mimic-check" }
mimic-codegen = { path = "crates/mimic-codegen" }
mimic-project = { path = "crates/mimic-project" }
mimic-net = { path = "crates/mimic-net" }
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
inkwell = { version = "0.11", default-features = false, features = ["llvm23-1", "target-all"] }

[profile.release]
lto = "thin"
